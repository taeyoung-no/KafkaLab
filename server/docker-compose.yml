services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafkalab-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3

  monitor:
    build: ./monitor
    container_name: kafkalab-monitor
    ports:
      - "8085:8085"

  producer:
    build: ./producer
    container_name: kafkalab-producer
    ports:
      - "8081:8081"

  consumer-1:
    build: ./consumer
    container_name: kafkalab-consumer-1
    environment:
      CONSUMER_ID: consumer-1

  consumer-2:
    build: ./consumer
    container_name: kafkalab-consumer-2
    environment:
      CONSUMER_ID: consumer-2

  consumer-3:
    build: ./consumer
    container_name: kafkalab-consumer-3
    environment:
      CONSUMER_ID: consumer-3
